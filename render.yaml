# Render blueprint. The dashboard can do all of this by hand; this file means the settings
# are reviewable and reproducible rather than living only in someone's browser.
services:
  - type: web
    name: wallet-service
    runtime: node
    plan: free
    # The API is one package inside the repository, so Render builds from server/ and the
    # frontend is ignored entirely. The UI deploys separately, on Vercel.
    rootDir: server
    # npm ci installs exactly the lockfile. postinstall runs prisma generate, so the client
    # exists before tsc compiles against it. migrate deploy applies any pending migration
    # before the new build is started - on the free plan there is no separate release phase,
    # so it belongs here.
    buildCommand: npm ci --include=dev && npm run migrate && npm run build
    startCommand: npm start
    # The frontend lives in the same repository and deploys to Vercel, so without this every
    # commit to frontend/ rebuilds the API: it recompiles, it runs migrate deploy against the
    # production database, and on the free plan it restarts the instance - all for a change
    # the API never sees. Paths are relative to the repository root, not to rootDir.
    buildFilter:
      paths:
        - server/**
        - render.yaml
    # Render restarts the service if this stops answering. It points at readiness, not
    # liveness, because a process that is up but cannot reach the database should not be
    # taking requests.
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Safe bootstrap default; replace with the verified ingress hop count for per-client IP limits.
      - key: TRUST_PROXY_HOPS
        value: "0"
      # Render sets PORT itself and the app reads it.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Comma-separated origins the browser client is served from. Without it the deployed
      # UI is blocked by the browser even though the API answers correctly.
      - key: CORS_ORIGINS
        sync: false
      # Logs are JSON here because stdout is a pipe, not a terminal. info keeps one line per
      # request; debug is for a live investigation and should be put back afterwards.
      - key: LOG_LEVEL
        value: info
